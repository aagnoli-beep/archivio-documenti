<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1f1f1d;
    --muted: #6b6a66;
    --line: #e2e0da;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --warn-bg: #fff4d6;
    --warn-text: #7a5200;
    --ok-bg: #e4f4e8;
    --ok-text: #1f6b35;
    --bad-bg: #fde4e1;
    --bad-text: #8a1f14;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1e;
      --text: #ecebe6;
      --muted: #a09f99;
      --line: #33332f;
      --accent: #6d9bff;
      --accent-text: #0b1a3a;
      --warn-bg: #3d2f08;
      --warn-text: #ffd97a;
      --ok-bg: #0f3320;
      --ok-text: #9be3b0;
      --bad-bg: #40130f;
      --bad-text: #ffb3ab;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
  }
  a { color: var(--accent); }

  .top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 960px; margin: 0 auto; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .top h1 { font-size: 18px; margin: 0; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .user { font-size: 12px; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { max-width: 960px; margin: 0 auto; padding: 12px 14px 40px; }

  .search input {
    width: 100%; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  @media (min-width: 700px) { .filters { grid-template-columns: repeat(4, 1fr); } }
  select, input, textarea {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%;
  }

  .summary { color: var(--muted); font-size: 13px; margin: 12px 2px 6px; }
  .banner { margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); font-size: 14px; cursor: pointer; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; box-shadow: var(--shadow);
  }
  .card:active { transform: scale(.995); }
  .card .t { font-weight: 600; grid-column: 1; }
  .card .d { color: var(--muted); font-size: 13px; grid-column: 2; grid-row: 1; white-space: nowrap; }
  .card .s { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
  .card .s b { color: var(--text); font-weight: 500; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin-right: 4px; }
  .tag.warn { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
  .tag.ok { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
  .tag.bad { background: var(--bad-bg); color: var(--bad-text); border-color: transparent; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; cursor: pointer;
    font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text);
  }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; margin-top: 12px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .icon { font: inherit; font-size: 20px; background: none; border: 0; color: var(--text); cursor: pointer; padding: 4px 8px; }
  .empty, .foot { color: var(--muted); text-align: center; font-size: 13px; margin-top: 20px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; }
  .sheet {
    position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 900px) {
    .sheet { left: auto; width: 560px; box-shadow: -8px 0 30px rgba(0,0,0,.2); }
  }
  .sheet-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; padding: 8px 10px; z-index: 1; }
  .sheet-head h2 { font-size: 16px; margin: 0; line-height: 1.3; }
  .sheet-body { padding: 12px 14px 40px; }
  .badges { margin-bottom: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0; font-size: 14px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; word-break: break-word; }
  .preview { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .preview iframe { width: 100%; height: 60vh; border: 0; display: block; }
  @media (min-width: 900px) { .preview iframe { height: 70vh; } }

  .edit { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .edit h3 { margin: 0 0 10px; font-size: 15px; }
  .edit label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .edit label > input, .edit label > select, .edit label > textarea { margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; box-shadow: var(--shadow);
  }
</style>
